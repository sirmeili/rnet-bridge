; RNET Bridge firmware. See docs/SPEC.md §4.
;   pio run -e esp32          build the device firmware (engine)
;   pio run -e esp32-console  build the M2 bring-up console (src/console/)
;   pio test -e native        run the lib/rnet unit tests on the host

[platformio]
default_envs = esp32

[env]
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra

[env:esp32]
; 7.1.3 bundles Arduino core 2.0.17. Revisit (8.x / core 3.x) when the M4 network libraries are added.
platform = espressif32@7.1.3
board = esp32-poe-iso
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<console/>

[env:esp32-console]
; The M2 serial console (SPEC §9 M2), for bring-up on other controller models or for rechecking
; protocol details. Flash with: pio run -e esp32-console -t upload
extends = env:esp32
build_src_filter = +<console/>

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags =
    ${env.build_flags}
    -Wpedantic
    -Wshadow
    -Werror
