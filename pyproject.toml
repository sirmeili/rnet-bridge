# Tooling for the Home Assistant integration, tests and tools (SPEC §7). Not a package.

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["firmware", "hardware"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",
    "ASYNC",
    "PT",            # pytest style
    "TID",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.rnet_bridge"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# HA platform packages re-export their enums without __all__; older releases (the
# hacs.json minimum) have no separate const module to import them from instead.
module = "homeassistant.*"
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
